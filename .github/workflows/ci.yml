name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  # ─── 1. Lint & Format ───────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: ESLint + Stylelint
        run: npm run lint

      - name: Prettier check
        run: npm run format

  # ─── 2. Unit Tests + Coverage ───────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/vitest/results.json
          if-no-files-found: warn
          retention-days: 30

  # ─── 3. E2E Tests ───────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Install Playwright – Chromium only
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright trace on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            test-results/playwright/results.json
            test-results/playwright/html-report/
          if-no-files-found: warn
          retention-days: 30

  # ─── 4. Combined Test Report ────────────────────────────────────────────────
  test-report:
    name: Test Report
    needs: [unit-tests, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Download unit test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: unit-test-results
          path: artifacts/unit

      - name: Download E2E test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: e2e-test-results
          path: artifacts/e2e

      - name: Generate combined test report
        run: node scripts/generate-test-report.mjs --unit artifacts/unit --e2e artifacts/e2e --output test-results/ci-test-report.md

      - name: Publish test report summary
        shell: bash
        run: cat test-results/ci-test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-test-report
          path: test-results/ci-test-report.md
          retention-days: 30

  # ─── 5. Publish Coverage to GitHub Pages (main only) ────────────────────────
  coverage-pages:
    name: Publish Coverage → GitHub Pages
    needs: unit-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
